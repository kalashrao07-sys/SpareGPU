{% extends "base.html" %}
{% block title %}Credits{% endblock %}
{% block content %}
<section class="card"><h1>Grant credits</h1>
  <form method="post" action="{{ url_for('admin_credits') }}" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="back" value="/admin/credits">
    <label>Username <input name="username" required></label>
    <label>Amount (negative removes) <input name="amount" inputmode="decimal" required></label>
    <button class="primary">Apply</button></form>
</section>
{% endblock %}
