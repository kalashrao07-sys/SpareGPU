{# Inline SVG icons (no external files, work offline). Usage: {{ icon('grid') }} #}
{% macro icon(name, size=22) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'grid' -%}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'clipboard' -%}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/>
{%- elif name == 'network' -%}<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>
{%- elif name == 'chip' -%}<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>
{%- elif name == 'list' -%}<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>
{%- elif name == 'wrench' -%}<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.4-.6-.6-2.4z"/>
{%- elif name == 'logout' -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>
{%- elif name == 'bolt' -%}<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
{%- elif name == 'code' -%}<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>
{%- elif name == 'jobs' -%}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
{%- elif name == 'pool' -%}<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 11h2M12 11h2M7 17v3M17 17v3"/>
{%- elif name == 'laptop' -%}<rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2 19h20"/>
{%- elif name == 'link' -%}<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>
{%- elif name == 'coin' -%}<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.8-1.6-1.2-2.8-1.2-1.6 0-2.8.8-2.8 2s1.2 1.7 2.8 2 2.8.8 2.8 2-1.2 2-2.8 2c-1.2 0-2.3-.4-2.8-1.2M12 6.5V8m0 8v1.5"/>
{%- elif name == 'store' -%}<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v1.5a3 3 0 01-6 0 3 3 0 01-4 0 3 3 0 01-6 0z"/><path d="M5 13v7h14v-7"/>
{%- elif name == 'check' -%}<path d="M5 13l4 4L19 7"/>
{%- endif -%}
</svg>
{%- endmacro %}
